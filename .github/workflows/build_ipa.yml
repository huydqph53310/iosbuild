name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Code with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Ensure Git LFS Binaries Downloaded
        run: |
          git lfs install
          git lfs pull || true
          echo "=== Checking Data File Headers ==="
          file Data/globalgamemanagers.assets || true
          file Data/resources.assets || true

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode.app || sudo xcode-select -s /Applications/Xcode_15.4.app || true
          xcodebuild -version

      - name: Build with Xcode
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 2>&1 | tee xcodebuild.log || {
              echo "==================== BUILD FAILED: EXACT ERRORS ==================== "
              grep -E -C 5 "(error:|fatal error:|Undefined symbol|clang: error|ld:)" xcodebuild.log || tail -n 200 xcodebuild.log
              echo "==================== TAIL OF LOG ==================== "
              tail -n 100 xcodebuild.log
              exit 1
            }

      - name: Package to IPA
        run: |
          APP_PATH=$(find ./build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ./build/Build/Products -name "*.app" -type d | grep -v "Intermediates" | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "Error: Cannot find compiled .app bundle!"
            exit 1
          fi
          echo "Found compiled app at: $APP_PATH"

          mkdir -p "$APP_PATH/Frameworks"

          # 1. Embed UnityFramework.framework if present in Products and not already embedded
          if [ ! -d "$APP_PATH/Frameworks/UnityFramework.framework" ]; then
            FW_PATH=$(find ./build/Build/Products -name "UnityFramework.framework" -type d | grep -v "Intermediates" | head -n 1)
            if [ -n "$FW_PATH" ]; then
              echo "Embedding UnityFramework.framework into app/Frameworks..."
              cp -a "$FW_PATH" "$APP_PATH/Frameworks/"
            fi
          fi

          # 2. Embed Data directory into app bundle and framework
          if [ -d "./Data" ]; then
            echo "Copying Data directory into app bundle..."
            rm -rf "$APP_PATH/Data"
            cp -a "./Data" "$APP_PATH/Data"
            if [ -d "$APP_PATH/Frameworks/UnityFramework.framework" ]; then
              rm -rf "$APP_PATH/Frameworks/UnityFramework.framework/Data"
              cp -a "./Data" "$APP_PATH/Frameworks/UnityFramework.framework/Data"
            fi
          fi

          # 3. Inspect every framework in app/Frameworks: Remove static archives
          for fw in "$APP_PATH"/Frameworks/*.framework; do
            if [ -d "$fw" ]; then
              fw_name=$(basename "$fw" .framework)
              fw_bin="$fw/$fw_name"
              if [ -f "$fw_bin" ]; then
                bin_type=$(file -b "$fw_bin")
                echo "Framework $fw_name binary type: $bin_type"
                if [[ "$bin_type" == *"archive"* ]] || [[ "$bin_type" == *"current ar archive"* ]]; then
                  echo "Removing static framework $fw_name from app/Frameworks"
                  rm -rf "$fw"
                fi
              fi
            fi
          done

          # 4. Create IPA for TrollStore / Sideload
          rm -rf Payload Army3.ipa
          mkdir Payload
          cp -a "$APP_PATH" Payload/
          zip -r -y -q Army3.ipa Payload
          echo "Created Army3.ipa successfully ($(ls -lh Army3.ipa | awk '{print $5}'))"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: latest
          name: "MobiArmy3 iOS IPA (Latest)"
          body: "Tự động xuất file IPA cài đặt cho iPhone / TrollStore. Tải trực tiếp file Army3.ipa bên dưới không lo Chrome chặn cảnh báo."
          files: Army3.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
